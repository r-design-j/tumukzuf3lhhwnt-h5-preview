<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no,email=no,address=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <title>元中心当前场</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { min-height: 100%; background: #fafafa; font-size: 13.333333vw; scrollbar-width: none; }
    body {
      min-height: 100%; margin: 0; overflow-x: hidden; background: #fafafa; color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      font-weight: 400; letter-spacing: 0; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      scrollbar-width: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    button { font: inherit; }
    .app-shell { min-height: 100vh; margin: 0 auto; overflow-x: hidden; background: #fff; }
    .hero-card {
      position: relative; height: 3.76rem; margin: .2rem .4rem 0; overflow: hidden; border-radius: .1rem;
      background: #f2f2f7; box-shadow: 0 .18rem .34rem rgba(0,0,0,.14);
    }
    .hero-image { display: block; width: 100%; height: 100%; object-fit: cover; }
    .hero-title {
      position: absolute; bottom: .78rem; left: .4rem; color: #fff; font-size: .3rem; font-weight: 500;
      line-height: .42rem; text-shadow: 0 .02rem .06rem rgba(0,0,0,.16);
    }
    .coach-row {
      position: relative; display: flex; align-items: center; min-height: 1.9rem;
      padding: .46rem 2.3rem .44rem .4rem; background: #fff;
    }
    .coach-avatar { display: block; flex: 0 0 1rem; width: 1rem; height: 1rem; border-radius: 50%; object-fit: cover; background: #9fc8ff; }
    .coach-name-line { display: flex; align-items: center; min-width: 0; margin-left: .2rem; }
    .coach-name { color: #111; font-size: .32rem; font-weight: 600; line-height: .44rem; white-space: nowrap; }
    .male-symbol { display: block; flex: 0 0 .3rem; width: .3rem; height: .3rem; margin-left: .22rem; }
    .share-button {
      position: absolute; top: 1.06rem; right: 0; display: flex; align-items: center; justify-content: center;
      width: 1.5rem; height: .48rem; min-width: 0; margin: 0; padding: 0 .18rem; border: 0;
      border-radius: .24rem 0 0 .24rem; background: #00c853; color: #fff; font-size: .28rem; font-weight: 400;
      line-height: .48rem; appearance: none; -webkit-appearance: none;
    }
    .share-button:active { background: #00b84c; }
    .share-symbol { display: block; width: .3rem; height: .3rem; margin-right: .12rem; }
    .soft-divider { height: .16rem; background: #fafafa; }
    .info-list { background: #fff; }
    .info-row {
      display: flex; align-items: center; min-height: .96rem; margin-left: .4rem; padding-right: .4rem;
      border-bottom: 1px solid #ededf2;
    }
    .date-row { position: relative; min-height: .96rem; }
    .time-select {
      position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0;
      border: 0; outline: 0; background: transparent; color: transparent; cursor: pointer; font-size: 16px;
      appearance: none; -webkit-appearance: none;
    }
    .time-select option { color: #111; background: #fff; }
    .location-row { min-height: 1.04rem; padding-right: .36rem; border-bottom: 0; }
    .row-icon { display: block; flex: 0 0 .32rem; width: .32rem; height: .32rem; margin-right: .08rem; }
    .row-text { display: block; flex: 1; min-width: 0; color: #111; font-size: .28rem; font-weight: 500; line-height: .4rem; }
    .strong-text { white-space: nowrap; }
    .map-button { display: flex; align-items: center; justify-content: center; flex: 0 0 .76rem; width: .76rem; height: .76rem; margin-left: .2rem; border-radius: 50%; }
    .map-arrow { display: block; width: .76rem; height: .76rem; border-radius: 50%; }
    .booking-row { display: flex; align-items: center; min-height: 1.32rem; padding: 0 .4rem; background: #fff; }
    .booking-icon { display: block; flex: 0 0 .32rem; width: .32rem; height: .32rem; margin-right: .08rem; }
    .booking-text { color: #fa5151; font-size: .28rem; font-weight: 500; line-height: .4rem; }
    .detail-section { padding-right: .4rem; padding-left: .4rem; background: #fff; }
    .purpose-section { padding-top: .32rem; padding-bottom: .08rem; }
    .strength-section { padding-top: .58rem; padding-bottom: .08rem; }
    .intro-section { padding-top: .26rem; padding-bottom: 1.8rem; }
    .section-title-row { display: flex; align-items: center; }
    .section-ring { display: block; flex: 0 0 .25rem; width: .25rem; height: .25rem; margin-right: .08rem; }
    .section-title { color: #111; font-size: .3rem; font-weight: 600; line-height: .42rem; }
    .section-body { display: block; margin: .28rem 0 0; color: #666; font-size: .28rem; font-weight: 400; line-height: .5rem; }
    .intro-section .section-body { margin-top: .22rem; font-size: .22rem; line-height: .44rem; }
    .short-body { line-height: .4rem; }
    .stars { display: flex; align-items: center; margin-top: .28rem; }
    .star-icon { display: block; width: .36rem; height: .36rem; }
    .star-icon + .star-icon { margin-left: .12rem; }
    .page-end-spacer { height: .88rem; background: #fafafa; }
    .status-toast {
      position: fixed; z-index: 30; left: 50%; bottom: .6rem; padding: .16rem .26rem;
      transform: translateX(-50%) translateY(.2rem); border-radius: .16rem; background: rgba(0,0,0,.76);
      color: #fff; font-size: .26rem; opacity: 0; pointer-events: none; transition: .18s ease;
    }
    .status-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media screen and (min-width: 431px) {
      html { background: #f5f5f7; font-size: 57.333333px; }
      body { background: #f5f5f7; }
      .app-shell { max-width: 430px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="hero-card">
      <img class="hero-image" src="assets/venue-hero.jpg" alt="元中心入场课程">
      <span class="hero-title" id="courseTitle">元中心当前场</span>
    </section>

    <section class="coach-row">
      <img class="coach-avatar" src="assets/coach-avatar.jpg" alt="王涛">
      <div class="coach-name-line">
        <span class="coach-name">王涛（场地）</span>
        <img class="male-symbol" src="assets/icon-male.png" alt="男">
      </div>
      <button class="share-button" type="button" id="shareButton" aria-label="分享课程">
        <img class="share-symbol" src="assets/icon-share.png" alt="">
        <span>分享</span>
      </button>
    </section>

    <div class="soft-divider"></div>

    <section class="info-list">
      <div class="info-row date-row">
        <img class="row-icon" src="assets/icon-calendar.png" alt="">
        <span class="row-text strong-text" id="courseDate">正在读取当前时间</span>
        <select class="time-select" id="courseTimeSelect" aria-label="选择时段" aria-describedby="courseDate">
          <option value="auto">跟随当前时间</option>
        </select>
      </div>
      <div class="info-row">
        <img class="row-icon" src="assets/icon-group.png" alt="">
        <span class="row-text">团体课</span>
      </div>
      <div class="info-row location-row">
        <img class="row-icon" src="assets/icon-store.png" alt="">
        <span class="row-text">小米健身房（元中心）</span>
        <div class="map-button" role="img" aria-label="场馆导航">
          <img class="map-arrow" src="assets/icon-navigation.png" alt="">
        </div>
      </div>
    </section>

    <div class="soft-divider"></div>

    <section class="booking-row">
      <img class="booking-icon" src="assets/icon-booking.png" alt="">
      <span class="booking-text">25人已预约</span>
    </section>

    <div class="soft-divider"></div>

    <section class="detail-section purpose-section">
      <div class="section-title-row">
        <img class="section-ring" src="assets/icon-section-ring.png" alt="">
        <span class="section-title">训练目的</span>
      </div>
      <p class="section-body short-body">其他</p>
    </section>

    <section class="detail-section strength-section">
      <div class="section-title-row">
        <img class="section-ring" src="assets/icon-section-ring.png" alt="">
        <span class="section-title">训练强度</span>
      </div>
      <div class="stars" aria-label="训练强度一星">
        <img class="star-icon" src="assets/icon-star-active.png" alt="">
        <img class="star-icon" src="assets/icon-star-muted.png" alt="">
        <img class="star-icon" src="assets/icon-star-muted.png" alt="">
        <img class="star-icon" src="assets/icon-star-muted.png" alt="">
        <img class="star-icon" src="assets/icon-star-muted.png" alt="">
      </div>
    </section>

    <section class="detail-section intro-section">
      <div class="section-title-row">
        <img class="section-ring" src="assets/icon-section-ring.png" alt="">
        <span class="section-title">课程介绍</span>
      </div>
      <p class="section-body">每天早上11点，系统上线第二天入场预约，凭预约进场训练，无预约无法进去场地训练</p>
    </section>

    <div class="page-end-spacer"></div>
  </main>
  <div class="status-toast" id="statusToast" role="status"></div>

  <script>
    (function () {
      var weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      var courseMap = {
        morning: { title: '元中心早场', timeRange: '08:00-09:00' },
        noon: { title: '元中心中午场', timeRange: '12:00-13:00' },
        evening: { title: '元中心晚场', timeRange: '18:00-19:00' }
      };
      var toastTimer = null;
      var courseRefreshTimer = null;
      var hourParam = getParam('hour');
      var selectedHour = /^(?:[01]?\d|2[0-3])$/.test(hourParam) ? String(Number(hourParam)) : hourParam === 'auto' ? 'auto' : '';
      var timeSelect = document.getElementById('courseTimeSelect');

      function pad(value) { return value < 10 ? '0' + value : String(value); }

      function getParam(name) {
        var source = window.location.search || '';
        var hash = window.location.hash || '';
        if (!source && hash.indexOf('?') >= 0) source = hash.slice(hash.indexOf('?'));
        var query = source.charAt(0) === '?' ? source.slice(1) : source;
        var pairs = query ? query.split('&') : [];
        for (var i = 0; i < pairs.length; i += 1) {
          var pair = pairs[i].split('=');
          if (decodeURIComponent(pair[0] || '') === name) return decodeURIComponent(pair.slice(1).join('=') || '');
        }
        return '';
      }

      function resolveExplicitPeriod() {
        var value = getParam('period') || getParam('session') || getParam('type');
        if (value === 'morning' || value === 'early' || value === '早场' || value === '早上') return 'morning';
        if (value === 'noon' || value === 'lunch' || value === 'midday' || value === '午场' || value === '中午') return 'noon';
        if (value === 'evening' || value === 'night' || value === '晚场' || value === '晚上') return 'evening';
        return '';
      }

      function resolveCourse(now) {
        var explicitPeriod = resolveExplicitPeriod();
        if (!selectedHour && explicitPeriod) return courseMap[explicitPeriod];

        var startHour = selectedHour && selectedHour !== 'auto' ? Number(selectedHour) : now.getHours();
        var endHour = (startHour + 1) % 24;
        var startText = pad(startHour) + ':00';
        var endText = pad(endHour) + ':00';
        return {
          title: '元中心' + startText + '场',
          timeRange: startText + '-' + endText
        };
      }

      function updateCourse() {
        var now = new Date();
        var courseDate = new Date(now.getTime());
        var course = resolveCourse(now);
        var dateText = courseDate.getFullYear() + '-' + pad(courseDate.getMonth() + 1) + '-' + pad(courseDate.getDate()) + '（' + weekdays[courseDate.getDay()] + '）';
        document.getElementById('courseTitle').textContent = course.title;
        document.getElementById('courseDate').textContent = dateText + ' ' + course.timeRange;
        timeSelect.value = selectedHour || (resolveExplicitPeriod() ? String(Number(course.timeRange.slice(0, 2))) : 'auto');
        document.title = course.title;
      }

      function msUntilNextLocalDay(now) {
        var next = new Date(now.getTime());
        next.setHours(24, 0, 1, 0);
        return Math.max(1000, next.getTime() - now.getTime());
      }

      function msUntilNextLocalHour(now) {
        var next = new Date(now.getTime());
        next.setHours(next.getHours() + 1, 0, 0, 0);
        return Math.max(1000, next.getTime() - now.getTime());
      }

      function scheduleCourseRefresh() {
        window.clearTimeout(courseRefreshTimer);
        var now = new Date();
        var nextDateRefresh = msUntilNextLocalDay(now);
        var followsCurrentTime = selectedHour === 'auto' || (!selectedHour && !resolveExplicitPeriod());
        var nextCourseRefresh = followsCurrentTime ? msUntilNextLocalHour(now) : nextDateRefresh;
        courseRefreshTimer = window.setTimeout(function () { updateCourse(); scheduleCourseRefresh(); }, Math.min(nextDateRefresh, nextCourseRefresh));
      }

      for (var hour = 0; hour < 24; hour += 1) {
        var option = document.createElement('option');
        option.value = String(hour);
        option.textContent = pad(hour) + ':00-' + pad((hour + 1) % 24) + ':00';
        timeSelect.appendChild(option);
      }

      timeSelect.addEventListener('change', function () {
        selectedHour = timeSelect.value;
        updateCourse();
        scheduleCourseRefresh();
        // Keep reloads and the existing share action on the selected time slot.
        var url = new URL(window.location.href);
        url.searchParams.set('hour', selectedHour);
        window.history.replaceState(null, '', url.href);
      });

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) { updateCourse(); scheduleCourseRefresh(); }
      });
      window.addEventListener('pageshow', function () { updateCourse(); scheduleCourseRefresh(); });

      function showToast(message) {
        var toast = document.getElementById('statusToast');
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimer = window.setTimeout(function () { toast.classList.remove('show'); }, 1400);
      }

      document.getElementById('shareButton').addEventListener('click', function () {
        var url = window.location.href;
        if (navigator.share) {
          navigator.share({ title: document.title, url: url }).catch(function () {});
          return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () { showToast('链接已复制'); }).catch(function () {});
        }
      });

      updateCourse();
      scheduleCourseRefresh();
    }());
  </script>
</body>
</html>
