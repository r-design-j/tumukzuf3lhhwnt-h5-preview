<!doctype html>

    /* Phone navigation uses logical pixels; the browser supplies any real safe area. */
    @media screen and (max-width: 767px), screen and (pointer: coarse) {
      :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }

        max-width: 500px; min-height: 100svh;

        padding-bottom: calc(64px + var(--safe-bottom));

      .booking-footer {
        width: min(100%, 500px); height: calc(64px + var(--safe-bottom));
        padding: 8px 0.407608696rem calc(8px + var(--safe-bottom));
      }
      .cancel-booking { height: 48px; border-radius: 24px; padding-top: 0; font-size: 16px; line-height: 24px; }
      .status-toast { bottom: calc(80px + var(--safe-bottom)); }
    }
  </style>

  <dialog class="datetime-dialog" id="courseDateTimeDialog" aria-labelledby="dateTimeHeading">

      </div>
    </form>

  <div class="status-toast" id="statusToast" role="status"></div>

  <script>
    (function () {
      var weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      var courseMap = {
        morning: { title: '元中心早场', timeRange: '08:00-09:00' },
        noon: { title: '元中心中午场', timeRange: '12:00-13:00' },
        evening: { title: '元中心晚场', timeRange: '18:00-19:00' }
      };
      var toastTimer = null;
      var courseRefreshTimer = null;
      var hourParam = getParam('hour');
      var selectedHour = /^(?:[01]?\d|2[0-3])$/.test(hourParam) ? String(Number(hourParam)) : hourParam === 'auto' ? 'auto' : '';
      var selectedDate = parseLocalDate(getParam('date')) ? getParam('date') : '';
      var timeSelect = document.getElementById('courseTimeSelect');
      var dateInput = document.getElementById('courseDateInput');
      var dateTimeDialog = document.getElementById('courseDateTimeDialog');

      function pad(value) { return value < 10 ? '0' + value : String(value); }

      function formatLocalDate(date) {
        return String(date.getFullYear()).padStart(4, '0') + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
      }

      function parseLocalDate(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
        var parts = value.split('-').map(Number);
        if (parts[0] < 1) return null;
        var date = new Date();
        date.setHours(12, 0, 0, 0);
        date.setFullYear(parts[0], parts[1] - 1, parts[2]);
        return formatLocalDate(date) === value ? date : null;
      }

      function getParam(name) {
        var source = window.location.search || '';
        var hash = window.location.hash || '';
        if (!source && hash.indexOf('?') >= 0) source = hash.slice(hash.indexOf('?'));
        var query = source.charAt(0) === '?' ? source.slice(1) : source;
        var pairs = query ? query.split('&') : [];
        for (var i = 0; i < pairs.length; i += 1) {
          var pair = pairs[i].split('=');
          if (decodeURIComponent(pair[0] || '') === name) return decodeURIComponent(pair.slice(1).join('=') || '');
        }
        return '';
      }

      function resolveExplicitPeriod() {
        var value = getParam('period') || getParam('session') || getParam('type');
        if (value === 'morning' || value === 'early' || value === '早场' || value === '早上') return 'morning';
        if (value === 'noon' || value === 'lunch' || value === 'midday' || value === '午场' || value === '中午') return 'noon';
        if (value === 'evening' || value === 'night' || value === '夜场' || value === '晚场' || value === '晚上') return 'evening';
        return '';
      }

      function followsCurrentTime() {
        return selectedHour === 'auto' || (!selectedHour && !resolveExplicitPeriod());
      }

      function currentCourseStart(now) {
        var start = new Date(now.getTime());
        start.setHours(start.getHours() + (start.getMinutes() >= 55 ? 1 : 0), 0, 0, 0);
        return start;
      }

      function resolveCourse(now) {
        var explicitPeriod = resolveExplicitPeriod();
        if (!selectedHour && explicitPeriod) return courseMap[explicitPeriod];

        var startHour = selectedHour && selectedHour !== 'auto' ? Number(selectedHour) : currentCourseStart(now).getHours();
        var endHour = (startHour + 1) % 24;
        var startText = pad(startHour) + ':00';
        var endText = pad(endHour) + ':00';
        return {
          title: courseMap[startHour < 15 ? 'noon' : 'evening'].title,
          timeRange: startText + '-' + endText
        };
      }

      function updateCourse() {
        var now = new Date();
        var courseDate = parseLocalDate(selectedDate) || (followsCurrentTime() ? currentCourseStart(now) : now);
        var course = resolveCourse(now);
        var dateText = formatLocalDate(courseDate) + '（' + weekdays[courseDate.getDay()] + '）';
        document.getElementById('courseTitle').textContent = course.title;
        document.getElementById('pageTitle').textContent = course.title;
        document.getElementById('courseDate').textContent = dateText + ' ' + course.timeRange;
        document.getElementById('courseDate').innerHTML = '<span>' + formatLocalDate(courseDate) + '</span><span class="course-weekday">（' + weekdays[courseDate.getDay()] + '）</span><span class="course-date-space"> </span><span class="course-range">' + course.timeRange + '</span>';
        document.title = course.title;
      }

      function msUntilNextLocalDay(now) {
        var next = new Date(now.getTime());
        next.setHours(24, 0, 1, 0);
        return Math.max(1000, next.getTime() - now.getTime());
      }

      function msUntilNextCourse(now) {
        var next = new Date(now.getTime());
        next.setHours(next.getHours() + (next.getMinutes() >= 55 ? 1 : 0), 55, 0, 0);
        return Math.max(1, next.getTime() - now.getTime());
      }

      function scheduleCourseRefresh() {
        window.clearTimeout(courseRefreshTimer);
        var now = new Date();
        var nextDateRefresh = msUntilNextLocalDay(now);
        var nextCourseRefresh = followsCurrentTime() ? msUntilNextCourse(now) : nextDateRefresh;
        courseRefreshTimer = window.setTimeout(function () { updateCourse(); scheduleCourseRefresh(); }, Math.min(nextDateRefresh, nextCourseRefresh));
      }

      for (var hour = 0; hour < 24; hour += 1) {
        var option = document.createElement('option');
        option.value = String(hour);
        option.textContent = pad(hour) + ':00-' + pad((hour + 1) % 24) + ':00';
        timeSelect.appendChild(option);
      }

      function applyDateTime() {
        updateCourse();
        scheduleCourseRefresh();
        // Keep reloads and the existing share action on the selected date and time.
        var url = new URL(window.location.href);
        url.searchParams.set('hour', selectedHour);
        if (selectedDate) url.searchParams.set('date', selectedDate);
        else url.searchParams.delete('date');
        window.history.replaceState(null, '', url.href);
        dateTimeDialog.close();
      }

      document.getElementById('courseDateTimeButton').addEventListener('click', function () {
        var now = new Date();
        dateInput.value = selectedDate || formatLocalDate(followsCurrentTime() ? currentCourseStart(now) : now);
        timeSelect.value = String(Number(resolveCourse(now).timeRange.slice(0, 2)));
        dateTimeDialog.showModal();
      });

      document.getElementById('courseDateTimeForm').addEventListener('submit', function (event) {
        event.preventDefault();
        if (!parseLocalDate(dateInput.value)) { dateInput.reportValidity(); return; }
        selectedDate = dateInput.value;
        selectedHour = timeSelect.value;
        applyDateTime();
      });

      document.getElementById('cancelDateTimeButton').addEventListener('click', function () { dateTimeDialog.close(); });
      document.getElementById('resetDateTimeButton').addEventListener('click', function () {
        selectedDate = '';
        selectedHour = 'auto';
        applyDateTime();
      });
      dateTimeDialog.addEventListener('click', function (event) {
        var bounds = dateTimeDialog.getBoundingClientRect();
        if (event.target === dateTimeDialog && (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom)) dateTimeDialog.close();
      });

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) { updateCourse(); scheduleCourseRefresh(); }
      });
      window.addEventListener('pageshow', function () { updateCourse(); scheduleCourseRefresh(); });

      function showToast(message) {
        var toast = document.getElementById('statusToast');
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimer = window.setTimeout(function () { toast.classList.remove('show'); }, 1400);
      }

      document.getElementById('shareButton').addEventListener('click', function () {
        var url = window.location.href;
        if (navigator.share) {
          navigator.share({ title: document.title, url: url }).catch(function () {});
          return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () { showToast('链接已复制'); }).catch(function () {});
        }
      });

      document.getElementById('backButton').addEventListener('click', function () { window.history.back(); });
      document.getElementById('cancelBookingButton').addEventListener('click', function () { showToast('请在微信小程序中管理预约'); });

      updateCourse();
      scheduleCourseRefresh();
    }());
  </script>
</body>
</html>
